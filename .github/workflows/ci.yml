#
# Main extension distribution pipeline.
#
# Gate 0 proof surface: this builds native binaries for linux/macos/windows AND
# the three DuckDB-WASM platforms (wasm_mvp, wasm_eh, wasm_threads). The WASM
# jobs are produced automatically by the distribution matrix in
# extension-ci-tools; see docs/adr/0002-wasm-build-target.md for why they are
# expected to succeed for a Rust C-API extension.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust unit tests, fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.6
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5.6
      extension_name: healpix
      extra_toolchains: rust;python3
      exclude_archs: 'linux_amd64_musl'
